name: Deploy ResolveAI to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "public/**"
      - "worker.js"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolveai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy ResolveAI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Deploy Worker and static assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "59e334d8f3005249578fe143ae3c848c"
          command: deploy

      - name: Skip deployment until Cloudflare token is configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Build completed. Add the CLOUDFLARE_API_TOKEN GitHub Actions secret to enable deployment."

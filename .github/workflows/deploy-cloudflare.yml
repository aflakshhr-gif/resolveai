name: Deploy ResolveAI to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "public/**"
      - "worker.js"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolveai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy ResolveAI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Check Cloudflare deployment secret
        id: cloudflare-token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the CLOUDFLARE_API_TOKEN repository secret to enable deployment."
          fi

      - name: Deploy Worker and static assets
        if: ${{ steps.cloudflare-token.outputs.configured == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "59e334d8f3005249578fe143ae3c848c"
          command: deploy

      - name: Skip deployment until Cloudflare token is configured
        if: ${{ steps.cloudflare-token.outputs.configured != 'true' }}
        run: echo "Build completed. Deployment was skipped because CLOUDFLARE_API_TOKEN is not configured."

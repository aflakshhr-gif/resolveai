name: CI

on:
  push:
    branches: [main, 'preview/resolveai-secret-refresh', 'preview/password-kdf-canary']
  pull_request:

jobs:
  resolveai-smoke-script:
    name: ResolveAI smoke-test script validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies for unit tests
        run: npm install
      - name: Run ResolveAI unit tests
        run: npm test
      - name: Validate Worker JavaScript syntax
        run: node --check worker.js
      - name: Validate smoke-test shell syntax
        run: bash -n scripts/check-resolveai.sh
      - name: Validate dedicated D1 schema migrations
        run: |
          cat migrations/0001_initial.sql migrations/0002_team_invites.sql | sqlite3 :memory:
          test "$(sqlite3 :memory: 'SELECT 1')" = "1"

  web:
    name: Web typecheck, static export and Workers dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx --yes wrangler@latest deploy --dry-run


  preview-live-smoke:
    name: Live password KDF canary (isolated Preview Worker)
    if: github.ref == 'refs/heads/preview/password-kdf-canary'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RESOLVEAI_URL: https://preview-password-kdf-canary-resolveai.aflakshhr.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Check the live Preview Worker and password KDF
        run: bash scripts/check-resolveai.sh

  mobile:
    name: Expo mobile validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo export --platform android
      - run: npx expo export --platform ios

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  resolveai-smoke-script:
    name: ResolveAI smoke-test script validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate smoke-test shell syntax
        run: bash -n scripts/check-resolveai.sh
      - name: Validate dedicated D1 schema migration
        run: |
          sqlite3 :memory: < migrations/0001_initial.sql
          test "$(sqlite3 :memory: 'SELECT 1')" = "1"

  web:
    name: Web typecheck, static export and Workers dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx --yes wrangler@latest deploy --dry-run

  mobile:
    name: Expo mobile validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo export --platform android
      - run: npx expo export --platform ios

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  resolveai-smoke-script:
    name: ResolveAI smoke-test script validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker JavaScript syntax
        run: node --check worker.js
      - name: Verify legacy password hash compatibility
        run: node scripts/test-password-hash-compat.mjs
      - name: Validate smoke-test shell syntax
        run: bash -n scripts/check-resolveai.sh scripts/test-membership-isolation.sh
      - name: Verify unit workspace data isolation
        run: bash scripts/test-membership-isolation.sh
      - name: Validate dedicated D1 schema migrations
        run: |
          cat migrations/0001_initial.sql migrations/0002_team_invites.sql migrations/0003_unit_membership_workspaces.sql | sqlite3 :memory:
          test "$(sqlite3 :memory: 'SELECT 1')" = "1"

  web:
    name: Web typecheck, static export and Workers dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx --yes wrangler@latest deploy --dry-run

  mobile:
    name: Expo mobile validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo export --platform android
      - run: npx expo export --platform ios

  preview-health:
    name: Cloudflare preview and read-only D1 health
    runs-on: ubuntu-latest
    needs: [resolveai-smoke-script, web, mobile]
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed preview and D1 connectivity without changing data
        run: bash scripts/check-preview-health.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  resolveai-smoke-script:
    name: ResolveAI smoke-test script validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker JavaScript syntax
        run: node --check worker.js
      - name: Validate smoke-test shell syntax
        run: bash -n scripts/check-resolveai.sh scripts/check-preview-health.sh
      - name: Verify runtime D1 schema batching
        run: node scripts/test-d1-schema-batch.mjs
      - name: Validate dedicated D1 schema migrations
        run: |
          cat migrations/0001_initial.sql migrations/0002_team_invites.sql | sqlite3 :memory:
          test "$(sqlite3 :memory: 'SELECT 1')" = "1"

  web:
    name: Web typecheck, static export and Workers dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify legacy password hash compatibility
        run: node scripts/test-password-hash-compat.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx --yes wrangler@latest deploy --dry-run
      - name: Verify deployed preview and read-only D1 connectivity
        run: bash scripts/check-preview-health.sh
      - name: Verify production Worker and read-only D1 connectivity after main deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: RESOLVEAI_URL=https://resolveai.aflakshhr.workers.dev bash scripts/check-preview-health.sh

  mobile:
    name: Expo mobile validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo export --platform android
      - run: npx expo export --platform ios

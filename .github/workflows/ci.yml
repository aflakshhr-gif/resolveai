name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  resolveai-smoke-script:
    name: ResolveAI smoke-test script validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker JavaScript syntax
        run: node --check worker.js
      - name: Validate smoke-test shell syntax
        run: bash -n scripts/check-resolveai.sh scripts/check-preview-health.sh scripts/test-membership-isolation.sh scripts/test-legacy-session-fallback.sh scripts/test-legacy-account-mapping.sh scripts/test-password-reset.sh scripts/test-apps-script-mailer.sh scripts/test-email-verification.sh
      - name: Verify runtime D1 schema batching
        run: node scripts/test-d1-schema-batch.mjs
      - name: Verify unit workspace data isolation
        run: bash scripts/test-membership-isolation.sh
      - name: Verify existing admin session on legacy schema
        run: bash scripts/test-legacy-session-fallback.sh
      - name: Verify safe legacy account-to-unit mapping
        run: bash scripts/test-legacy-account-mapping.sh
      - name: Validate dedicated D1 schema migrations
        run: |
          cat migrations/0001_initial.sql migrations/0002_team_invites.sql migrations/0003_unit_membership_workspaces.sql migrations/0004_block_admin_workspaces.sql migrations/0005_password_reset.sql migrations/0006_email_verification.sql | sqlite3 :memory:
          test "$(sqlite3 :memory: 'SELECT 1')" = "1"
      - name: Verify password reset token safety
        run: bash scripts/test-password-reset.sh
      - name: Verify Google Apps Script mailer syntax and required safeguards
        run: bash scripts/test-apps-script-mailer.sh
      - name: Verify public email verification token lifecycle and legacy compatibility
        run: bash scripts/test-email-verification.sh

  web:
    name: Web typecheck, static export and Workers dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify legacy password hash compatibility
        run: node scripts/test-password-hash-compat.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx --yes wrangler@latest deploy --dry-run
      - name: Verify deployed preview and read-only D1 connectivity
        run: bash scripts/check-preview-health.sh
      - name: Verify production Worker and read-only D1 connectivity after main deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: RESOLVEAI_URL=https://resolveai.aflakshhr.workers.dev bash scripts/check-preview-health.sh

  mobile:
    name: Expo mobile validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo export --platform android
      - run: npx expo export --platform ios
